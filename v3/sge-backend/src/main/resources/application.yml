server:
  port: ${SDRERC_V3_PORT:8081}

spring:
  application:
    name: sdrerc-v3-backend
  servlet:
    multipart:
      # Carga diaria (Registro): plantilla Excel/CSV subida por el usuario, mismo limite implicito
      # que V2 (JFileChooser sin tope explicito); 20MB cubre archivos reales de la plantilla oficial.
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    # Misma base Oracle SDRERC_APP que V2 (ver plan de migracion, seccion 3:
    # convivencia V2/V3). Sin credenciales reales en este archivo; se resuelven
    # por variable de entorno, igual principio de cascada que TotpSecretCipher en V2.
    url: ${SDRERC_V3_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${SDRERC_V3_DB_USER:}
    password: ${SDRERC_V3_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: SdrercV3Pool
      # Dimensionado para concurrencia web real (a diferencia del pool de V2,
      # pensado para un cliente de escritorio individual - ver riesgo 2 del plan).
      # Ajustar segun PROCESSES/SESSIONS real de la instancia Oracle antes de
      # escalar usuarios reales a V3.
      minimum-idle: ${SDRERC_V3_DB_POOL_MIN:5}
      maximum-pool-size: ${SDRERC_V3_DB_POOL_MAX:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

sdrerc:
  v3:
    jwt:
      # Nuevo en V3 (V2 no firma nada, no hay sesion HTTP). NO reutilizar security.totp.key de
      # V2 para esto: son secretos con proposito distinto, no deben compartirse. Requerido, sin
      # valor por defecto (JwtService falla rapido al arrancar si falta).
      secret: ${SDRERC_V3_JWT_SECRET:}
      challenge-ttl-minutes: ${SDRERC_V3_JWT_CHALLENGE_TTL_MIN:5}
      # 01/09/2026: bajado de 30 a 10 minutos (pedido explícito del usuario), acompañado del
      # cierre de sesión proactivo por inactividad del lado del cliente (ver InactivityGuard.tsx,
      # v3/sdrerc-v3-frontend/src/components) — mismos 10 minutos, para que el aviso de
      # inactividad aparezca justo cuando el JWT ya está por vencer, no antes.
      session-ttl-minutes: ${SDRERC_V3_JWT_SESSION_TTL_MIN:10}
    onlyoffice:
      # Edicion en linea de plantillas de documento (Administracion > Plantillas de documento) via
      # OnlyOffice Document Server (contenedor Docker local, ver v3/CLAUDE.md). Secreto propio,
      # distinto de sdrerc.v3.jwt.secret (proposito distinto: firma la comunicacion con el
      # contenedor OnlyOffice, no las sesiones de la app) - se configura tambien, con el MISMO
      # valor, como variable de entorno JWT_SECRET del propio contenedor. Opcional (no falla el
      # arranque si falta): la edicion en linea es una funcionalidad adicional, no un requisito
      # para que el resto de la app funcione.
      jwt-secret: ${SDRERC_V3_ONLYOFFICE_JWT_SECRET:}
      # URL con la que el CONTENEDOR de OnlyOffice alcanza a este backend (no la que usa el
      # navegador) - host.docker.internal es el nombre especial que Docker Desktop resuelve al
      # host real, funciona sin importar si el navegador llego por localhost o por Tailscale.
      backend-callback-base-url: ${SDRERC_V3_ONLYOFFICE_BACKEND_URL:http://host.docker.internal:8081}
      document-download-token-ttl-minutes: ${SDRERC_V3_ONLYOFFICE_TOKEN_TTL_MIN:10}
