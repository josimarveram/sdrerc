# EJEMPLO, no aplicar tal cual. Ilustra qué claves espera el backend en un
# Secret de Kubernetes/OpenShift (ver v3/sdrerc-v3-backend/src/main/resources/application.yml).
#
# NO commitear este archivo con valores reales. La forma correcta de crear el
# Secret real es por línea de comandos (no queda en el historial de git):
#
#   oc create secret generic sdrerc-v3-backend-secret \
#     --from-literal=DB_URL='jdbc:oracle:thin:@<host-oracle>:1521/<servicio>' \
#     --from-literal=DB_USER='sdrerc_app' \
#     --from-literal=DB_PASSWORD='********' \
#     --from-literal=JWT_SECRET='********' \
#     --from-literal=TOTP_KEY='********' \
#     --from-literal=SMTP_HOST='********' \
#     --from-literal=SMTP_PORT='587' \
#     --from-literal=SMTP_USER='********' \
#     --from-literal=SMTP_PASSWORD='********' \
#     --from-literal=SMTP_FROM='********' \
#     -n sdrerc-v3
#
# SMTP_* y TOTP_KEY son opcionales (2FA por correo / edición en línea de
# plantillas) - el backend arranca igual sin ellos. DB_URL/DB_USER/DB_PASSWORD/
# JWT_SECRET sí son obligatorios (el backend falla rápido al arrancar si faltan).
apiVersion: v1
kind: Secret
metadata:
  name: sdrerc-v3-backend-secret
  namespace: sdrerc-v3
type: Opaque
stringData:
  DB_URL: "jdbc:oracle:thin:@CAMBIAR-HOST-ORACLE:1521/CAMBIAR-SERVICIO"
  DB_USER: "CAMBIAR"
  DB_PASSWORD: "CAMBIAR"
  JWT_SECRET: "CAMBIAR"
  TOTP_KEY: ""
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
