# 2FA por correo (login V2): solucion interina con SMTP de proveedor externo
# (ej. Gmail con clave de aplicacion) mientras se migra a un SMTP institucional
# dentro de la red del cliente. No commitear una contraseña real aqui: usar la
# variable de entorno SDRERC_APP_SMTP_PASSWORD en su lugar.
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.user=
mail.smtp.password=
mail.smtp.from=
